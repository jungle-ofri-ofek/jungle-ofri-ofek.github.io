name: Build and deploy Jungle Widget v4
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare source and signing key
        env:
          KEY_PASSWORD: ${{ secrets.JUNGLE_WIDGET_KEY_PASSWORD }}
        run: |
          rm -rf widget-src && mkdir widget-src
          unzip 1-jungle-widget-v4-source.zip -d widget-src
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in 3-jungle-release.keystore.enc -out widget-src/jungle-release.keystore -pass env:KEY_PASSWORD
      - name: Static RemoteViews safety inspection
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('widget-src/app/src/main/res/layout/widget.xml').getroot()
          allowed={'LinearLayout','TextView'}
          tags=[e.tag.split('}')[-1] for e in root.iter()]
          assert all(t in allowed for t in tags), tags
          assert tags.count('LinearLayout') == 1, tags
          assert root.tag.split('}')[-1] == 'LinearLayout'
          assert all(e.tag.split('}')[-1]=='TextView' for e in list(root))
          print('RemoteViews-safe flat tree:', tags)
          PY
      - name: Build release APK
        env:
          JUNGLE_STORE_PASSWORD: ${{ secrets.JUNGLE_WIDGET_KEY_PASSWORD }}
          JUNGLE_KEY_PASSWORD: ${{ secrets.JUNGLE_WIDGET_KEY_PASSWORD }}
        run: |
          cd widget-src
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../jungle-widget-v4.apk
      - name: Verify signature, package and version
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs jungle-widget-v4.apk | tee apksigner.txt
          grep -qi 'c87c6eee' apksigner.txt
          "$AAPT" dump badging jungle-widget-v4.apk | tee badging.txt
          grep -q "package: name='com.jungle.ofriofek' versionCode='4' versionName='4.0'" badging.txt
          "$AAPT" dump xmltree jungle-widget-v4.apk res/layout/widget.xml | tee widget-tree.txt
          sha256sum jungle-widget-v4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jungle-widget-v4
          path: jungle-widget-v4.apk
      - name: Deploy APK to Pages repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jungle-widget-v4.apk
          git commit -m 'Deploy Jungle widget v4 APK'
          git push
