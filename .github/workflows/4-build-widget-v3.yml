name: Build Jungle Widget v3
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare source and key
        env:
          KEY_PASSWORD: ${{ secrets.JUNGLE_WIDGET_KEY_PASSWORD }}
        run: |
          rm -rf widget-src && mkdir widget-src
          unzip 1-1-jungle-widget-v3-source.zip -d widget-src
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in 3-jungle-release.keystore.enc -out widget-src/jungle-release.keystore -pass env:KEY_PASSWORD
      - name: Build release APK
        env:
          JUNGLE_STORE_PASSWORD: ${{ secrets.JUNGLE_WIDGET_KEY_PASSWORD }}
          JUNGLE_KEY_PASSWORD: ${{ secrets.JUNGLE_WIDGET_KEY_PASSWORD }}
        run: |
          cd widget-src
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../jungle-widget-v3.apk
      - name: Verify APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs jungle-widget-v3.apk
          "$AAPT" dump badging jungle-widget-v3.apk
          "$AAPT" dump xmltree jungle-widget-v3.apk AndroidManifest.xml
          sha256sum jungle-widget-v3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jungle-widget-v3
          path: jungle-widget-v3.apk
